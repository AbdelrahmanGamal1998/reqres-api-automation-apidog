name: API Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write

jobs:
  validate:
    name: Validate OpenAPI spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint:spec

  test:
    name: Run API tests
    runs-on: ubuntu-latest
    needs: validate
    env:
      REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Run the Apidog suite
        if: ${{ env.REQRES_API_KEY != '' }}
        run: npm test

      - name: Skip notice
        if: ${{ env.REQRES_API_KEY == '' }}
        run: echo "::notice::REQRES_API_KEY secret is not set, so the API tests were skipped."

      - name: Upload reports
        if: ${{ always() && env.REQRES_API_KEY != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: reports/

      - name: Publish JUnit results
        if: ${{ always() && env.REQRES_API_KEY != '' }}
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: reports/*.xml
          fail_on_failure: false
          include_passed: true
